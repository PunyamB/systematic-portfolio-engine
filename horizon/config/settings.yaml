# ============================================================
# HORIZON SYSTEMATIC PORTFOLIO ENGINE — MASTER SETTINGS
# Successor to Meridian. V4 6-tier circuit breaker.
# All system parameters live here. Edit only via VS Code.
# ============================================================

# --- UNIVERSE & BENCHMARK ---
universe:
  index: SP500
  benchmark: SPY
  min_price: 5.0
  min_adv_usd: 1_000_000

# --- CAPITAL ---
portfolio:
  initial_capital: 1_000_000
  max_position_weight: 0.05
  cash_buffer: 0.02
  min_positions: 20

# --- REBALANCE ---
# Regime-conditional rebalance scheduling.
# Each regime has its own trading-day interval. Regime change forces
# an immediate rebalance and resets the clock.
rebalance:
  regime_trading_days:
    bull:     21
    recovery: 21
    bear:     7
    crisis:   4
  execution_time: "09:35"
  fill_check_time: "09:45"

# --- SIGNALS ---
signals:
  lookback_momentum: 252
  lookback_reversal: 5
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  piotroski_min_score: 0
  ic_floor: 0.0
  ic_lookback_min: 12
  min_signal_coverage: 10   # require >=10 of 15 signals for ticker eligibility
  regime_multipliers:
    bull:
      momentum_12_1: 1.3
      earnings_momentum: 1.2
      pe_zscore: 1.0
      pb_zscore: 1.0
      ev_ebitda_zscore: 1.0
      roe_stability: 1.0
      gross_margin_trend: 1.0
      piotroski: 1.0
      earnings_accruals: 1.0
      short_term_reversal: 0.7
      rsi_extremes: 0.7
      revenue_growth: 1.3
      low_volatility: 0.7
      fcf_yield: 1.0
      volume_momentum: 1.2
    recovery:
      momentum_12_1: 1.1
      earnings_momentum: 1.1
      pe_zscore: 1.2
      pb_zscore: 1.2
      ev_ebitda_zscore: 1.2
      roe_stability: 1.1
      gross_margin_trend: 1.1
      piotroski: 1.1
      earnings_accruals: 1.1
      short_term_reversal: 1.0
      rsi_extremes: 1.0
      revenue_growth: 1.1
      low_volatility: 1.0
      fcf_yield: 1.1
      volume_momentum: 1.0
    bear:
      momentum_12_1: 0.7
      earnings_momentum: 0.8
      pe_zscore: 1.2
      pb_zscore: 1.2
      ev_ebitda_zscore: 1.2
      roe_stability: 1.3
      gross_margin_trend: 1.1
      piotroski: 1.3
      earnings_accruals: 1.3
      short_term_reversal: 1.2
      rsi_extremes: 1.2
      revenue_growth: 0.8
      low_volatility: 1.3
      fcf_yield: 1.2
      volume_momentum: 0.8
    crisis:
      momentum_12_1: 0.5
      earnings_momentum: 0.5
      pe_zscore: 1.0
      pb_zscore: 1.0
      ev_ebitda_zscore: 1.0
      roe_stability: 1.5
      gross_margin_trend: 1.0
      piotroski: 1.5
      earnings_accruals: 1.5
      short_term_reversal: 1.3
      rsi_extremes: 1.3
      revenue_growth: 0.5
      low_volatility: 1.5
      fcf_yield: 1.3
      volume_momentum: 0.5

# --- REGIME DETECTION ---
regime:
  vix_lookback: 252
  vix_elevated_threshold: 0.80
  vix_crisis_threshold: 1.20
  breadth_high: 0.60
  breadth_low: 0.40
  pmi_expansion: 50.0
  economic_cycle_lookback: 5   # weeks

# --- OPTIMIZER ---
# Horizon backtest config: lambda=0.004, ra=1.35
# These differ from Meridian production values (0.005, 1.5).
optimizer:
  objective: max_sharpe
  risk_aversion: 1.35
  turnover_lambda: 0.004
  covariance_method: ledoit_wolf
  cov_lookback: 252

# --- TURNOVER ---
turnover:
  round_trip_cost_bps: 10
  max_turnover_per_rebalance: 0.30

# --- DRIFT REBALANCE ---
drift_rebalance:
  max_position_drift: 0.03
  max_portfolio_drift: 0.05
  max_sector_drift: 0.05

# --- TRAILING STOPS ---
stop_loss:
  method: trailing
  vol_lookback: 25
  vol_multiplier: 2.0
  floor: 0.05
  cap: 0.20
  rebuy_cooldown_days: 4
  seasoning_days: 1

# ============================================================
# HORIZON V4 SIX-TIER CIRCUIT BREAKER
# Empirical-percentile-anchored ladder derived from Meridian V1's
# 1997-2025 realized drawdown distribution. See Horizon System
# Reference v1, Section 5.
#
#   T0 <2.0%      inv=98 maxwt=5.0% floor=0.85 rebal=regime
#   T1 2.0-3.0%   inv=98 maxwt=5.0% floor=0.85 rebal=21d
#   T2 3.0-6.85%  inv=95 maxwt=3.5% floor=0.70 rebal=5d
#   T3 6.85-14.5% inv=75 maxwt=3.0% floor=0.55 rebal=3d
#   T4 14.5-21.5% inv=60 maxwt=2.5% floor=0.40 rebal=1d  NO NEW POS
#   T5 >=21.5%    inv=40 maxwt=2.5% floor=0.40 rebal=1d  NO NEW POS
# ============================================================
circuit_breaker:
  # Drawdown thresholds (lower bound for each tier)
  t1_pct: 0.020
  t2_pct: 0.030
  t3_pct: 0.0685
  t4_pct: 0.145
  t5_pct: 0.215

  # Recovery ratio for re-engagement after CB activation
  recovery_ratio: 0.40

  # No-new-positions block applies at this tier and above.
  # T4 and T5 both block (T4 = 4, threshold inclusive).
  no_new_positions_tier: 4

  # CB tier rebalance intervals (trading days). Effective interval is
  # min(regime_interval, cb_interval). T0=999 means no override.
  cb_trading_days:
    0: 999    # no override; defer to regime cadence
    1: 21
    2: 5
    3: 3
    4: 1
    5: 1

  # CB tier max position weight (decimal). Effective cap is
  # min(portfolio.max_position_weight, cb_max_weight).
  cb_max_weights:
    0: 0.050
    1: 0.050
    2: 0.035
    3: 0.030
    4: 0.025
    5: 0.025

  # CB tier invested target (sum of weights). Optimizer constraint.
  cb_invested:
    0: 0.98
    1: 0.98
    2: 0.95
    3: 0.75
    4: 0.60
    5: 0.40

  # CB tier sum floor (minimum gross exposure). Optimizer constraint.
  # Hard-enforced via cvxpy: sum(weights) >= sum_floor.
  cb_sum_floor:
    0: 0.85
    1: 0.85
    2: 0.70
    3: 0.55
    4: 0.40
    5: 0.40

# --- SECTOR NEUTRALIZATION ---
sectors:
  standalone:
    - Technology
    - Healthcare
    - Consumer Discretionary
    - Consumer Staples
    - Communication Services
  pooled:
    - [Materials, Industrials]
    - [Real Estate, Financials]
    - [Utilities, Energy]
  min_stocks_for_standalone: 30

# --- RISK MODEL ---
risk:
  beta_lookback: 252
  signal_decay_threshold: 0.65
  liquidity_flag_pct: 0.10

# --- DATA QUALITY ---
data_quality:
  max_missing_pct: 0.05
  stale_days: 3

# --- REGIME OVERRIDE ---
regime_override:
  enabled: false
  force_state: null    # bull | bear | recovery | crisis

# --- EXECUTION ---
execution:
  order_type: market
  pre_trade_file: data/approved/approved_trades.csv

# --- PATHS ---
paths:
  raw_data: data/raw
  processed_data: data/processed
  snapshots: data/snapshots
  approved_trades: data/approved
  logs: logs
  pipeline_health: logs/pipeline_health.json

# --- STOP REPLACEMENT ---
stop_replacement:
  cash_threshold: 100000
  cooldown_days: 4
